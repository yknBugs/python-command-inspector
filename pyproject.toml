[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "command-inspector"
version = "1.10.0"
description = "Read-only transparency analysis of proposed shell commands"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bash = ["tree-sitter==0.25.2", "tree-sitter-bash==0.25.0"]
windows = ["tree-sitter==0.25.2", "tree-sitter-powershell==0.26.4"]
javascript = ["tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0"]
sql = ["sqlglot==30.21.0"]
dev = ["pytest==8.4.2", "jsonschema==4.25.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
command_inspector = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
